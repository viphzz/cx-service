<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CX 服务调度与运营中心</title>
<style>
:root{
  --bg:#071126;--panel:#0D1B38;--panel2:#12234a;--line:rgba(158,175,210,.14);
  --ink:#F4F7FF;--sub:#9EAFD2;--faint:#5F6E94;
  --pri:#4C8DFF;--pri-d:#3b6fd1;--ok:#29D391;--warn:#FFB84D;--err:#FF5B6E;--info:#7AA5FF;
  --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background-image:
    radial-gradient(900px 500px at 90% -20%,rgba(76,141,255,.09),transparent 60%),
    radial-gradient(700px 460px at -15% 110%,rgba(41,211,145,.06),transparent 55%)}
.hidden{display:none !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#23345e;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 按钮 ---------- */
button{border:1px solid var(--line);background:#16264e;color:var(--ink);
  border-radius:9px;padding:7px 14px;font-size:13px;cursor:pointer;
  transition:.15s;font-family:inherit}
button:hover{background:#1c3160;border-color:rgba(158,175,210,.3)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--pri);border-color:transparent;color:#fff;font-weight:600}
button.primary:hover{background:var(--pri-d)}
button.go{background:rgba(41,211,145,.16);border-color:rgba(41,211,145,.4);color:var(--ok);font-weight:600}
button.go:hover{background:rgba(41,211,145,.24)}
button.danger{background:rgba(255,91,110,.1);border-color:rgba(255,91,110,.35);color:var(--err)}
button.danger:hover{background:rgba(255,91,110,.18)}
button.sm{padding:4px 10px;font-size:12px;border-radius:7px}

input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:13.5px;font-family:inherit;background:#0a1830;color:var(--ink);transition:.15s}
input:focus,select:focus{outline:none;border-color:var(--pri);
  box-shadow:0 0 0 3px rgba(76,141,255,.18)}
input::placeholder{color:var(--faint)}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 5px}

/* ---------- 登录 ---------- */
#loginBox{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:38px 34px 32px;width:100%;max-width:370px;box-shadow:var(--shadow)}
.lg-ic{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#4C8DFF,#7AA5FF);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:#fff;
  box-shadow:0 10px 28px -8px rgba(76,141,255,.6)}
.login h1{text-align:center;font-size:17px;margin:0 0 4px}
.login .lg-sub{text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:1.5px;margin-bottom:22px}
.login button{width:100%;margin-top:16px;padding:12px;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,#4C8DFF,#3b6fd1);color:#fff;border:0;border-radius:11px}
#loginMsg{color:var(--err);font-size:13px;margin-top:12px;min-height:18px;text-align:center}

/* ---------- 布局 ---------- */
#app{display:flex;min-height:100vh}
.side{width:216px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .bi{width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,#4C8DFF,#7AA5FF);display:flex;align-items:center;
  justify-content:center;color:#fff;box-shadow:0 6px 16px -6px rgba(76,141,255,.6)}
.brand b{font-size:14.5px;display:block;line-height:1.3}
.brand small{color:var(--faint);font-size:10px;letter-spacing:1.2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:10px;
  color:var(--sub);text-decoration:none;font-size:13.5px;margin-bottom:3px;
  transition:.13s;border:1px solid transparent}
.nav a svg{flex:none;opacity:.85}
.nav a:hover{color:var(--ink);background:rgba(76,141,255,.08)}
.nav a.on{color:#fff;background:rgba(76,141,255,.16);border-color:rgba(76,141,255,.3)}
.side .ver{margin-top:auto;color:var(--faint);font-size:11px;padding:8px 12px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(7,17,38,.85);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:13px 24px}
#topTitle{font-size:16px;font-weight:700}
#dpChip{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
  padding:5px 13px;border-radius:20px;border:1px solid rgba(41,211,145,.4);
  background:rgba(41,211,145,.1);color:var(--ok);font-weight:600;cursor:pointer}
#dpChip.paused{border-color:rgba(255,184,77,.45);background:rgba(255,184,77,.12);color:var(--warn)}
#dpChip i{width:7px;height:7px;border-radius:50%;background:currentColor}
#btnLogout{font-size:12.5px;padding:6px 13px}

.content{padding:22px 24px 70px;max-width:1180px;width:100%;margin:0 auto}

/* ---------- 卡片与表格 ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.pd{padding:18px 20px}
.ptitle{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.5px;
  display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ptitle::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--pri)}
.ptitle .r{margin-left:auto;font-weight:400}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow)}
.kpi .n{font-size:26px;font-weight:800;line-height:1.2}
.kpi .l{color:var(--sub);font-size:12px;margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--faint);font-weight:600;font-size:11.5px;
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(158,175,210,.07);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:rgba(76,141,255,.05)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;letter-spacing:.3px}
.sub2{color:var(--sub)}
.faint{color:var(--faint)}
.empty{color:var(--faint);text-align:center;padding:34px 16px;font-size:13px}

/* ---------- 状态 pill ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2.5px 10px;border-radius:20px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor}
.t-submitted{background:rgba(255,184,77,.13);color:var(--warn)}
.t-queued{background:rgba(122,165,255,.13);color:var(--info)}
.t-logging{background:rgba(76,141,255,.15);color:var(--pri)}
.t-ready{background:rgba(255,184,77,.13);color:#ffd08a}
.t-running{background:rgba(41,211,145,.13);color:var(--ok)}
.t-done{background:rgba(41,211,145,.13);color:var(--ok)}
.t-failed,.t-canceled{background:rgba(255,91,110,.13);color:var(--err)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(41,211,145,.18)}
.dot.off{background:#46557e}
.dot.pause{background:var(--warn);box-shadow:0 0 0 3px rgba(255,184,77,.18)}
.st2{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.st2.on{background:rgba(41,211,145,.13);color:var(--ok)}
.st2.off{background:rgba(158,175,210,.12);color:var(--sub)}
.st2.pause{background:rgba(255,184,77,.13);color:var(--warn)}

/* ---------- 筛选条 ---------- */
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{width:auto;min-width:130px;padding:7.5px 11px;font-size:12.5px}
.bar .grow{flex:1}
.bar label{margin:0}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;
  padding:12px 14px;color:var(--sub);font-size:12.5px}
.pager button{padding:5px 12px;font-size:12px}

/* ---------- 趋势图 ---------- */
.trend{display:flex;align-items:flex-end;gap:14px;height:130px;padding:6px 4px 0}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tbars{display:flex;align-items:flex-end;gap:4px;height:96px;width:100%;
  justify-content:center}
.tbar{width:16px;border-radius:4px 4px 2px 2px;min-height:2px;transition:.3s}
.tbar.c{background:linear-gradient(180deg,#4C8DFF,#33569b)}
.tbar.d{background:linear-gradient(180deg,#29D391,#1a7a58)}
.tlab{font-size:10.5px;color:var(--faint);white-space:nowrap}
.legend{display:flex;gap:16px;color:var(--sub);font-size:11.5px;margin-bottom:8px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* ---------- 详情抽屉 ---------- */
#drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:94vw;z-index:70;
  background:var(--panel);border-left:1px solid var(--line);
  box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(105%);
  transition:.25s;display:flex;flex-direction:column}
#drawer.on{transform:none}
#dwHead{display:flex;align-items:center;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--line)}
#dwHead h3{margin:0;font-size:15px;flex:1}
#dwClose{background:none;border:0;color:var(--sub);font-size:18px;padding:4px 8px}
#dwBody{flex:1;overflow:auto;padding:18px 20px 40px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:7px 14px;font-size:13px;margin-bottom:6px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;word-break:break-all}

.tl{display:flex;margin:16px 0 6px}
.tnd{flex:1;position:relative;text-align:center}
.tnd i{display:block;width:9px;height:9px;border-radius:50%;background:#23345e;
  margin:0 auto 7px;transition:.3s}
.tnd::before{content:"";position:absolute;top:4px;left:-50%;width:100%;height:2px;
  background:#23345e}
.tnd:first-child::before{display:none}
.tnd em{font-style:normal;font-size:10.5px;color:var(--faint);white-space:nowrap}
.tnd.past i,.tnd.now i{background:var(--pri)}
.tnd.past::before,.tnd.now::before{background:var(--pri)}
.tnd.now em{color:var(--ink);font-weight:700}

.evline{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(158,175,210,.07);
  font-size:12.5px}
.evline:last-child{border-bottom:0}
.evline .ts{color:var(--faint);flex:none;font-family:ui-monospace,monospace;font-size:11.5px}
.evline .lv{flex:none;width:52px;font-weight:700;font-size:11px}
.evline .lv.info{color:var(--info)} .evline .lv.warn{color:var(--warn)}
.evline .lv.error{color:var(--err)}
.evline .m{color:var(--sub);word-break:break-all}

.mask{position:fixed;inset:0;background:rgba(3,8,20,.65);display:none;
  align-items:center;justify-content:center;z-index:90;padding:20px;
  backdrop-filter:blur(3px)}
.mask.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:22px 24px;max-width:600px;width:100%;max-height:84vh;overflow:auto;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.dlg h3{margin:0 0 5px;font-size:15px}
.dlg .sub2{color:var(--sub);font-size:12.5px;line-height:1.8;margin-bottom:14px}
.dlg textarea{width:100%;height:280px;font:12px/1.6 ui-monospace,Consolas,monospace;
  border:1px solid var(--line);border-radius:10px;padding:11px;resize:vertical;
  background:#0a1830;color:var(--ink)}
.dlg .foot{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}
.hint2{font-size:12px;color:var(--warn);margin-top:10px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(8px);
  background:#101f42;border:1px solid var(--line);color:var(--ink);
  padding:11px 22px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:.25s;z-index:99;box-shadow:0 16px 44px -12px rgba(0,0,0,.7)}
.toast.on{opacity:1;transform:translateX(-50%)}

.ops{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.note{font-size:12px;color:var(--sub);background:rgba(255,184,77,.08);
  border:1px solid rgba(255,184,77,.25);border-radius:10px;padding:10px 13px;
  line-height:1.7;margin-top:12px}
.badge{display:inline-flex;align-items:center;background:rgba(76,141,255,.14);
  color:var(--pri);border:1px solid rgba(76,141,255,.35);border-radius:999px;
  padding:2px 10px;font-size:11.5px;font-weight:600}

@media (max-width:860px){
  .side{width:64px;padding:18px 8px}
  .brand b,.brand small,.nav a span,.side .ver{display:none}
  .nav a{justify-content:center;padding:11px}
  .content{padding:16px 14px 60px}
  #drawer{width:100vw;max-width:100vw}
}
</style>

</div>

        <span>帮助中心</span></a>
      <a href="#/dispatch" data-r="dispatch">

      <a href="#/events" data-r="events">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>事件日志</span></a>
      <a href="#/audit" data-r="audit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>

<script>
const $ = id => document.getElementById(id);
const API = p => String(p).replace(/^\//, '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LABEL = {
  submitted: '已提交', queued: '等待处理', logging: '登录中',
  ready: '已准备就绪', running: '正在运行', done: '已完成',
  failed: '处理失败', canceled: '已取消'
};
const OPS = {
  submitted: [['accept', '开始登录', 'primary'], ['cancel', '取消', 'danger']],
  queued: [['cancel', '取消', 'danger']],
  logging: [['cancel', '取消', 'danger']],
  ready: [['begin', '开始任务', 'go'], ['cancel', '取消', 'danger']],
  running: [['finish', '标记完成', 'go'], ['cancel', '取消', 'danger']],
  done: [],
  failed: [['cancel', '关闭', '']],
  canceled: []
};
const LABEL_ACT = {accept: '已批准登录', begin: '已开始任务', finish: '已标记完成', cancel: '已取消'};

function toast(msg, bad) {
  const el = $('toast');
  el.textContent = msg;
  el.style.borderColor = bad ? 'rgba(255,91,110,.5)' : 'rgba(41,211,145,.4)';
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2600);
}

async function call(path, opt) {
  const r = await fetch(API(path), Object.assign(
    {headers: {'Content-Type': 'application/json'}}, opt || {}));
  if (r.status === 401) { showLogin(); throw new Error('未登录'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = (d.detail && d.detail.error) || d.error || ('HTTP ' + r.status);
    throw new Error(e);
  }
  return d;
}

function ago(iso) {
  if (!iso) return '-';
  let s = String(iso).replace(' ', 'T');
  if (!/[Zz]$|[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
  const t = Date.parse(s);
  if (!isFinite(t)) return '-';
  const m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  return Math.floor(h / 24) + ' 天前';
}
function fmt(iso) {
  if (!iso) return '-';
  return String(iso).slice(5, 16).replace('T', ' ');
}

/* ---------- 登录 ---------- */
function showLogin() {
  $('loginBox').classList.remove('hidden');
  $('app').classList.add('hidden');
}
$('btnLogin').onclick = async () => {
  const u = ($('admUser').value || 'admin').trim();
  const p = $('pwd').value;
  if (!p) { $('loginMsg').textContent = '请输入密码'; return; }
  $('btnLogin').disabled = true;
  $('loginMsg').textContent = '';
  try {
    const r = await fetch(API('/admin/login'), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      $('loginBox').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('pwd').value = '';
      refreshChip();
      route();
    } else {
      $('loginMsg').textContent = (d.detail && d.detail.error) || '账号或密码错误';
    }
  } catch (e) { $('loginMsg').textContent = '网络错误'; }
  $('btnLogin').disabled = false;
};
['admUser', 'pwd'].forEach(id => $(id).addEventListener('keydown',
  e => { if (e.key === 'Enter') $('btnLogin').click(); }));
$('btnLogout').onclick = async () => {
  await fetch(API('/admin/logout'), {method: 'POST'});
  showLogin();
};

async function refreshChip() {
  try {
    const d = await call('/admin/dispatch');
    const chip = $('dpChip');
    chip.classList.toggle('paused', !!d.paused);
    $('dpChipTx').textContent = d.paused ? '调度已暂停' : '调度正常';
  } catch (e) {}
}
$('dpChip').onclick = () => { location.hash = '#/dispatch'; };

/* ---------- 路由 ---------- */
const TITLES = {overview: '运营总览', analytics: '数据分析', tasks: '任务管理',
                abnormal: '异常任务', agents: '服务节点',
                cards: '卡密管理', announce: '公告管理', feedback: '用户反馈',
                helpadmin: '帮助中心', dispatch: '调度控制', events: '事件日志',
                audit: '操作审计', settings: '系统设置', 'new-task': '手动补单'};
let CUR = 'overview';

function route() {
  const h = (location.hash || '#/overview').replace('#/', '') || 'overview';
  CUR = TITLES[h] ? h : 'overview';
  $('topTitle').textContent = TITLES[CUR];
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('on', a.dataset.r === CUR));
  closeDrawer();
  VIEWS[CUR]();
}
window.addEventListener('hashchange', route);

const VIEWS = {
  overview: renderOverview, analytics: renderAnalytics, tasks: renderTasks,
  abnormal: renderAbnormal, agents: renderAgents,
  cards: renderCards, announce: renderAnnounce, feedback: renderFeedback,
  helpadmin: renderHelpAdmin, dispatch: renderDispatch, events: renderEvents,
  audit: renderAudit, settings: renderSettings, 'new-task': renderNewTask
};
setInterval(() => {
  if ($('app').classList.contains('hidden')) return;
  if (['overview', 'tasks', 'agents', 'dispatch'].indexOf(CUR) >= 0) VIEWS[CUR]();
  refreshChip();
}, 8000);

/* ---------- 详情抽屉 ---------- */
function openDrawer(title, html) {
  $('dwTitle').textContent = title;
  $('dwBody').innerHTML = html;
  $('drawer').classList.add('on');
}
function closeDrawer() { $('drawer').classList.remove('on'); }
$('dwClose').onclick = closeDrawer;

/* ---------- 运营总览 ---------- */
async function renderOverview() {
  $('view').innerHTML = `
    <div class="cards" id="ovCards"></div>
    <div class="panel pd" style="margin-top:14px">
      <div class="ptitle">调度状态</div>
      <div id="ovDispatchBody"></div>

      <div style="overflow:auto"><table><thead><tr>
        <th>ID</th><th>课程</th><th>账号</th><th>状态</th><th>节点</th><th>提交时间</th>
      </tr></thead><tbody id="ovRecent"></tbody></table></div>
    </div>`;
  try {

    $('ovCards').innerHTML = [
      ['a', d.today.created, '今日新增任务'],
      ['w', d.pending, '待处理任务'],
      ['r', d.active, '处理中任务'],
      ['g', d.today.done, '今日完成任务'],
      ['g', d.agents_online + ' / ' + (d.agents || []).length, '在线服务节点'],
    ].map(([c, n, l]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

    const dp = d.dispatch || {};
    $('ovDispatchBody').innerHTML = dp.paused
      ? `<div style="display:flex;align-items:center;gap:10px;color:var(--warn)">
           <span class="dot pause"></span><b>已暂停新任务派发</b>
           <span class="sub2" style="margin-left:auto">暂停至 ${esc((dp.pause_until || '').replace('T', ' ').slice(0, 16))}（UTC）</span></div>
         <div class="note" style="margin-top:10px">暂停只影响新任务派发，正在运行的任务继续执行。</div>`
      : `<div style="display:flex;align-items:center;gap:10px;color:var(--ok)">
           <span class="dot on"></span><b>调度正常运行</b>
           <span class="sub2" style="margin-left:auto">正在运行 ${stats.running || 0} · 已就绪 ${stats.ready || 0}</span></div>`;

    const mx = Math.max(1, ...(d.trend || []).flatMap(t => [t.created, t.done]));
    $('ovTrend').innerHTML = (d.trend || []).map(t =>
      `<div class="tcol"><div class="tbars">
         <div class="tbar c" style="height:${Math.round(t.created / mx * 96)}px" title="新建 ${t.created}"></div>
         <div class="tbar d" style="height:${Math.round(t.done / mx * 96)}px" title="完成 ${t.done}"></div>
       </div><div class="tlab">${t.date}</div></div>`).join('');

    $('ovAgents').innerHTML = (d.agents || []).map(a =>
      `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(158,175,210,.07)">
        <span class="dot ${a.status === 'online' ? (a.paused ? 'pause' : 'on') : 'off'}"></span>
        <b>${esc(a.id)}</b>
        <span class="sub2" style="margin-left:auto">在跑 ${(a.tasks || []).length} / 容量 ${a.capacity || 0}

    const r2 = await call('/admin/tasks?limit=8');

/* ---------- 任务管理 ---------- */
const TS = {page: 1, size: 15, status: '', q: ''};

async function renderTasks() {
  $('view').innerHTML = `
    <div class="bar">
      <select id="tsStatus">
        <option value="">全部状态</option>
        ${Object.keys(LABEL).map(s => `<option value="${s}">${LABEL[s]}</option>`).join('')}
      </select>
      <input id="tsQ" placeholder="搜索课程 / 备注 / 任务 ID" style="min-width:220px">
      <button id="tsSearch" class="primary">搜索</button>
      <span class="grow"></span>
      <a href="#/new-task"><button>＋ 手动补单</button></a>
    </div>
    <div class="panel" style="overflow:auto">
      <table><thead><tr>
        <th>ID</th><th>课程</th><th>账号</th><th>状态</th><th>节点</th><th>提交时间</th><th>操作</th>
      </tr></thead><tbody id="tsList"></tbody></table>
      <div class="pager" id="tsPager"></div>
    </div>`;
  $('tsStatus').value = TS.status;
  $('tsQ').value = TS.q;
  $('tsSearch').onclick = () => {
    TS.status = $('tsStatus').value;
    TS.q = $('tsQ').value.trim();
    TS.page = 1;
    loadTasks();
  };
  $('tsQ').addEventListener('keydown', e => { if (e.key === 'Enter') $('tsSearch').click(); });
  loadTasks();
}

async function loadTasks() {
  try {
    const p = new URLSearchParams({page: TS.page, size: TS.size});
    if (TS.status) p.set('status', TS.status);
    if (TS.q) p.set('q', TS.q);
    const d = await call('/admin/tasks?' + p.toString());
    const list = d.tasks || [];
    $('tsList').innerHTML = list.map(t => {
      const ops = (OPS[t.status] || []).map(([op, txt, cls]) =>
        `<button class="sm ${cls || ''}" data-id="${t.id}" data-op="${op}">${txt}</button>`).join(' ');
      return `<tr>
        <td class="mono" style="cursor:pointer" onclick="openTask(${t.id})">#${t.id}</td>
        <td style="cursor:pointer" onclick="openTask(${t.id})">${esc(t.course_name) || '<span class="faint">(未填)</span>'}</td>
        <td class="sub2">${esc(t.username)}</td>
        <td><span class="tag t-${t.status}"><i></i>${LABEL[t.status] || t.status}</span></td>
        <td class="sub2">${esc(t.agent_id) || '-'}</td>
        <td class="sub2">${fmt(t.created_at)}</td>
        <td onclick="event.stopPropagation()">${ops}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="7"><div class="empty">没有符合条件的任务</div></td></tr>';

    const pg = d.pagination;
    if (pg) {
      const pages = Math.max(1, Math.ceil(pg.total / pg.size));
      $('tsPager').innerHTML = `
        <span>共 ${pg.total} 条 · 第 ${pg.page} / ${pages} 页</span>
        <button id="pgPrev" ${pg.page <= 1 ? 'disabled' : ''}>上一页</button>
        <button id="pgNext" ${pg.page >= pages ? 'disabled' : ''}>下一页</button>`;
      const prev = $('pgPrev'), next = $('pgNext');
      if (prev) prev.onclick = () => { TS.page--; loadTasks(); };
      if (next) next.onclick = () => { TS.page++; loadTasks(); };
    } else {
      $('tsPager').innerHTML = '';
    }

    document.querySelectorAll('#tsList button[data-op]').forEach(b => {
      b.onclick = ev => { ev.stopPropagation(); act(b.dataset.id, b.dataset.op); };
    });
  } catch (e) {
    $('tsList').innerHTML = `<tr><td colspan="7"><div class="empty">${esc(e.message)}</div></td></tr>`;
  }
}

async function act(id, op) {
  if (op === 'cancel' && !confirm('确定取消任务 #' + id + '？')) return;
  try {
    await call('/admin/task/' + id + '/' + op, {method: 'POST'});
    toast('#' + id + ' ' + (LABEL_ACT[op] || op));
    if ($('drawer').classList.contains('on')) openTask(id);
    VIEWS[CUR]();
    refreshChip();
  } catch (e) { toast(e.message, true); }
}

async function openTask(id) {
  try {
    const d = await call('/admin/task/' + id);
    const t = d.task || {};
    const ag = d.agent;
    const evs = d.events || [];
    const ops = (OPS[t.status] || []).map(([op, txt, cls]) =>
      `<button class="${cls || ''}" data-op="${op}">${txt}</button>`).join('');

    const STAGES = ['已提交', '等待处理', '登录中', '已就绪', '正在运行', '已完成'];
    const SIDX = {submitted: 0, queued: 1, logging: 2, ready: 3, running: 4, done: 5};
    let tlHtml = '';
    if (t.status in SIDX) {
      const si = SIDX[t.status];
      tlHtml = '<div class="tl">' + STAGES.map((s, i) => {
        const c = i < si ? 'past' : (i === si ? 'now' : '');
        return `<div class="tnd ${c}"><i></i><em>${s}</em></div>`;
      }).join('') + '</div>';
    } else {
      tlHtml = `<div class="note" style="margin:12px 0">该任务已终止（${LABEL[t.status] || t.status}）</div>`;
    }

    openDrawer('任务 #' + id, `
      <div class="kv">
        <dt>任务 ID</dt><dd class="mono">#${t.id}</dd>
        <dt>当前状态</dt><dd><span class="tag t-${t.status}"><i></i>${LABEL[t.status] || t.status}</span></dd>
        <dt>课程</dt><dd>${esc(t.course_name) || '<span class="faint">(未填)</span>'}</dd>
        <dt>授课老师</dt><dd>${esc(t.note) || '-'}</dd>
        <dt>账号</dt><dd>${esc(t.username)}</dd>
        <dt>提交时间</dt><dd>${fmt(t.created_at)}</dd>
        <dt>开始时间</dt><dd>${fmt(t.started_at)}</dd>
        <dt>完成时间</dt><dd>${fmt(t.finished_at)}</dd>
        ${t.message ? `<dt>最近消息</dt><dd class="sub2">${esc(t.message)}</dd>` : ''}
      </div>
      ${tlHtml}
      ${ops ? `<div class="ops">${ops}</div>` : ''}
      ${ag ? `
      <div class="ptitle" style="margin-top:16px">服务节点</div>
      <div class="kv">
        <dt>节点</dt><dd><a href="javascript:openAgent('${esc(ag.id)}')" style="color:var(--pri)">${esc(ag.id)}</a>
          <span class="st2 ${ag.status === 'online' ? 'on' : 'off'}" style="margin-left:6px">${ag.status === 'online' ? '在线' : '离线'}</span></dd>
        <dt>心跳</dt><dd class="sub2">${ago(ag.last_seen)}</dd>
      </div>` : ''}
      <div class="ptitle" style="margin-top:16px">操作与事件历史</div>
      ${evs.map(e => `<div class="evline">
        <span class="ts">${fmt(e.ts)}</span>
        <span class="lv ${e.level}">${(e.level || '').toUpperCase()}</span>
        <span class="m">${e.task_id ? '#' + e.task_id + ' ' : ''}${esc(e.msg || '')}</span>
      </div>`).join('') || '<div class="empty">暂无事件</div>'}
      <div id="shotBox"></div>`);

    try {
      const sh = await call('/admin/task/' + id + '/shots');
      if ((sh.shots || []).length) {
        $('shotBox').innerHTML = `<div class="ptitle" style="margin-top:16px">异常截图</div>` +
          sh.shots.map(n => `<a href="admin/shots/${encodeURIComponent(n)}" target="_blank">
            <img src="admin/shots/${encodeURIComponent(n)}" style="width:100%;border-radius:10px;
              border:1px solid var(--line);margin-bottom:8px"></a>`).join('');
      }
    } catch (e) {}

    document.querySelectorAll('#dwBody .ops button').forEach(b => {
      b.onclick = () => act(id, b.dataset.op);
    });
  } catch (e) { toast(e.message, true); }
}

async function renderAgents() {
  $('view').innerHTML = `
    <div class="bar"><span class="sub2">节点状态按最后心跳实时判定（阈值 90 秒，可调）。点击节点查看详情。</span>
      <span class="grow"></span>
      <button id="btnAddAgent" class="primary">＋ 新增节点</button></div>
    <div class="cards" id="agList" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"></div>`;
  $('btnAddAgent').onclick = addAgentDlg;
  try {
    const d = await call('/admin/dispatch');
    $('agList').innerHTML = (d.agents || []).map(a => {
      const on = a.status === 'online';
      const cls = a.paused ? 'pause' : (on ? 'on' : 'off');
      const tag = a.paused ? '已暂停接单' : (on ? '在线' : '离线');
      const busy = (a.tasks || []).length;
      const load = a.capacity ? Math.round(busy / a.capacity * 100) : 0;
      return `<div class="kpi" style="cursor:pointer" onclick="openAgent('${esc(a.id)}')">
        <div style="display:flex;align-items:center;gap:9px">
          <span class="dot ${cls}"></span>
          <b>${esc(a.id)}</b>
          <span class="st2 ${cls}" style="margin-left:auto">${tag}</span>
        </div>
        <div class="n" style="font-size:20px;margin-top:10px">${busy} <span class="sub2" style="font-size:13px;font-weight:400">/ ${a.capacity || 0} 并发</span></div>
        <div class="l">负载 ${load}% · 心跳 ${ago(a.last_seen)}${a.version ? ' · v' + esc(a.version) : ''}</div>
        ${a.cpu != null ? `<div class="l">CPU ${Math.round(a.cpu)}% · 内存 ${Math.round(a.memory)}%${a.uptime ? ' · 运行 ' + esc(a.uptime) : ''}</div>` : ''}
        ${busy ? `<div class="l" style="margin-top:2px">在跑：${a.tasks.map(x => '#' + x).join(' ')}</div>` : ''}
      </div>`;
    }).join('') || '<div class="empty" style="grid-column:1/-1">还没有节点，点右上角新增</div>';
  } catch (e) {
    $('agList').innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(e.message)}</div>`;
  }
}

        </div>`).join('') || '<div class="empty">暂无</div>'}

      ${(a.events || []).map(e => `<div class="evline">
        <span class="ts">${fmt(e.ts)}</span>

        <span class="m">${e.task_id ? '#' + e.task_id + ' ' : ''}${esc(e.msg || '')}</span>
      </div>`).join('') || '<div class="empty">暂无</div>'}`);

    document.querySelectorAll('#dwBody .ops button').forEach(b => {
      b.onclick = () => agentAct(b.dataset.act, a.id);
    });
  } catch (e) { toast(e.message, true); }
}

async function agentAct(act, id) {
  if (act === 'pause' || act === 'resume') {
    try {
      await call('/admin/agents/' + encodeURIComponent(id) + '/' + act, {method: 'POST'});
      toast(act === 'pause' ? id + ' 已暂停接单' : id + ' 已恢复接单');
    } catch (e) { return toast(e.message, true); }
  } else if (act === 'script') {
    try {
      const d = await call('/admin/agents/' + encodeURIComponent(id) + '/token');
      showScript(id, d.script);
      return;
    } catch (e) { return toast(e.message, true); }
  } else if (act === 'cap') {
    const v = prompt('容量：同时开几个浏览器窗口（1~12）', String(4));
    if (v === null) return;
    try {
      await call('/admin/agents/' + encodeURIComponent(id) +
                 '/capacity?capacity=' + encodeURIComponent(v.trim()), {method: 'POST'});
      toast(id + ' 容量已改为 ' + v.trim());
    } catch (e) { return toast(e.message, true); }
  } else if (act === 'del') {
    if (!confirm('删除节点 ' + id + '？\n\n该机器会立刻连不上，需重新注册。')) return;
    try {
      await call('/admin/agents/' + encodeURIComponent(id), {method: 'DELETE'});
      toast('已删除 ' + id);
      closeDrawer();
    } catch (e) { return toast(e.message, true); }
  }
  openAgent(id);
  VIEWS[CUR]();
  refreshChip();
}

/* ---------- 卡密管理 ---------- */
const CD = {q: ''};
const CD_OPEN = {};   // 分组折叠状态：{quota: true/false}，默认全部收起

async function renderCards() {
  $('view').innerHTML = `
    <div class="bar">
      <input id="cdQ" placeholder="搜索卡密 / 编号" style="min-width:200px">
      <button id="cdSearch">搜索</button>
      <span class="grow"></span>
      <label style="margin:0">数量</label><input id="cdGenN" value="10" style="width:66px" inputmode="numeric">
      <label style="margin:0">每张次数</label><input id="cdGenQuota" value="1" style="width:66px" inputmode="numeric">
      <button id="btnGen" class="primary">生成卡密</button>
      <button id="btnExport">导出全部</button>
    </div>
    <div id="cdList"></div>`;
  $('cdQ').value = CD.q;
  $('cdSearch').onclick = () => { CD.q = $('cdQ').value.trim(); loadCards(); };
  $('cdQ').addEventListener('keydown', e => { if (e.key === 'Enter') $('cdSearch').click(); });
  $('btnGen').onclick = async () => {
    try {
      const d = await call('/admin/cards?n=' + encodeURIComponent($('cdGenN').value.trim() || '10') +
                           '&quota=' + encodeURIComponent($('cdGenQuota').value.trim() || '1'),
                           {method: 'POST'});
      toast('生成 ' + d.count + ' 张');
      loadCards();
    } catch (e) { toast(e.message, true); }
  };
  $('btnExport').onclick = async () => {
    try {
      const r = await fetch(API('/admin/cards/export-all'));
      if (r.status === 401) { showLogin(); return; }
      const t = await r.text();
      await navigator.clipboard.writeText(t);
      toast('已复制 ' + t.split('\n').filter(Boolean).length + ' 张卡密');
    } catch (e) { toast('复制失败，请手动导出', true); }
  };
  loadCards();
}

function cdExport(quota, onlyUnused) {
  const q = '?quota=' + quota + (onlyUnused ? '&status=unused' : '');
  fetch(API('/admin/cards/export-filter' + q)).then(async r => {
    if (r.status === 401) { showLogin(); return; }
    const t = await r.text();
    const n = t.split('\n').filter(Boolean).length;
    if (!n) return toast('这一组没有可导出的卡密', true);
    try {
      await navigator.clipboard.writeText(t);
      toast('已复制 ' + n + ' 张' + (onlyUnused ? '（未使用）' : ''));
    } catch (e) { toast('浏览器不让自动复制，请从控制台导出', true); }
  }).catch(() => toast('导出失败', true));
}

async function loadCards() {
  try {
    const d = await call('/admin/cards/all?limit=2000');
    let rows = d.detail || [];
    if (CD.q) {
      const k = CD.q.toUpperCase();
      rows = rows.filter(r => (r.code || '').toUpperCase().indexOf(k) >= 0
        || String(r.no) === CD.q);
    }
    if (!rows.length) { $('cdList').innerHTML = '<div class="empty">暂无卡密</div>'; return; }

    // 按卡密原始次数分组：单次、两次、三次……（用完的卡仍归入原组）
    const groups = {};
    rows.forEach(r => {
      const q = r.quota_total != null ? r.quota_total : r.quota;
      (groups[q] = groups[q] || []).push(r);
    });
    const quotas = Object.keys(groups).map(Number).sort((a, b) => a - b);

    $('cdList').innerHTML = quotas.map(q => {
      const list = groups[q];
      const unused = list.filter(x => x.status === 'unused');
      const used = list.filter(x => x.status !== 'unused');
      const open = !!CD_OPEN[q];
      const rowsHtml = [...unused, ...used].map(r => {
        const PILL = {unused: ['未使用', 't-done'], active: ['已激活', 't-queued'],
                      revoked: ['已禁用', 't-failed'], expired: ['已过期', 't-failed']};
        const pl = PILL[r.status] || [r.status, ''];
        return `<tr>
          <td class="mono">#${r.no}</td>
          <td class="mono">${esc(r.code)}</td>
          <td><span class="tag ${pl[1]}"><i></i>${pl[0]}</span></td>
          <td class="sub2">剩余 ${r.quota}/${r.quota_total != null ? r.quota_total : r.quota}</td>
          <td class="sub2">${fmt(r.created_at)}</td>
          <td class="sub2">${fmt(r.activated_at)}</td>
          <td>${r.status !== 'revoked' ? `<button class="sm danger" data-code="${esc(r.code)}">禁用</button>` : ''}</td>
        </tr>`;
      }).join('');
      return `<div class="panel" style="margin-bottom:12px">
        <div class="pd" style="padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer"
             onclick="cdToggle(${q})">
          <span style="font-size:15px;font-weight:700">${q} 次卡</span>
          <span class="badge">共 ${list.length} 张</span>
          <span class="sub2">未使用 ${unused.length} · 已用 ${used.length}</span>
          <span style="margin-left:auto;display:flex;gap:8px" onclick="event.stopPropagation()">
            <button class="sm" onclick="cdExport(${q}, false)">导出本组</button>
            <button class="sm go" onclick="cdExport(${q}, true)">导出未使用</button>
            <span class="sub2" style="align-self:center">${open ? '收起 ▲' : '展开 ▼'}</span>
          </span>
        </div>
        ${open ? `<div style="overflow:auto"><table><thead><tr>
            <th>编号</th><th>卡密</th><th>状态</th><th>次数</th><th>创建时间</th><th>激活时间</th><th>操作</th>
          </tr></thead><tbody>${rowsHtml}</tbody></table></div>` : ''}
      </div>`;
    }).join('');

    document.querySelectorAll('#cdList button[data-code]').forEach(b => {
      b.onclick = async ev => {
        ev.stopPropagation();
        if (!confirm('禁用卡密 ' + b.dataset.code + '？\n禁用后无法兑换。')) return;
        try {
          await call('/admin/cards/' + encodeURIComponent(b.dataset.code) + '/revoke',
                     {method: 'POST'});
          toast('已禁用');
          loadCards();
        } catch (e) { toast(e.message, true); }
      };
    });
  } catch (e) {
    $('cdList').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function cdToggle(q) {
  CD_OPEN[q] = !CD_OPEN[q];
  loadCards();
}

async function renderDispatch() {

  try {
    const d = await call('/admin/dispatch');
    const paused = d.paused;
    $('dpBody').innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px;${paused ? 'color:var(--warn)' : 'color:var(--ok)'}">
          <span class="dot ${paused ? 'pause' : 'on'}" style="width:12px;height:12px"></span>
          <b style="font-size:17px">${paused ? '已暂停新任务派发' : '调度正常运行'}</b>
        </div>
        <span class="grow"></span>
        ${paused
          ? `<span class="sub2">暂停至 ${esc((d.pause_until || '').replace('T', ' ').slice(0, 16))} UTC，到期自动恢复</span>
             <button id="btnDpResume" class="go">立即恢复派发</button>`
          : `<label style="margin:0">暂停时长（小时）</label>
             <input id="dpHours" value="1" style="width:80px" inputmode="numeric">
             <button id="btnDpPause" class="danger">暂停新任务派发</button>`}
      </div>
      <div class="note">暂停派发的真实影响：<b>节点不再领取新任务</b>（含课程探测），
        <b>正在运行的任务不受影响</b>，继续执行直到管理员标记完成。
        ${d.quiet_hours && d.quiet_hours !== 'none' ? '另设每日禁刷时段：' + esc(d.quiet_hours) + ' 点。' : ''}</div>`;
    const resumeBtn = $('btnDpResume');
    if (resumeBtn) resumeBtn.onclick = async () => {
      try {
        await call('/admin/resume', {method: 'POST'});
        toast('已恢复派发');

      } catch (e) { toast(e.message, true); }

    const pauseBtn = $('btnDpPause');
    if (pauseBtn) pauseBtn.onclick = async () => {
      const h = parseInt($('dpHours').value, 10);
      if (!h || h < 1) { toast('填暂停小时数', true); return; }
      if (!confirm('确认暂停新任务派发 ' + h + ' 小时？\n\n正在运行的任务不会受到影响。')) return;
      try {
        await call('/admin/pause?hours=' + h, {method: 'POST'});
        toast('已暂停 ' + h + ' 小时');
        renderDispatch(); refreshChip();
      } catch (e) { toast(e.message, true); }
    };
    $('dpAgents').innerHTML = (d.agents || []).map(a => {
      const on = a.status === 'online';
      return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;
        border-bottom:1px solid rgba(158,175,210,.07)">
        <span class="dot ${a.paused ? 'pause' : (on ? 'on' : 'off')}"></span>
        <b>${esc(a.id)}</b>
        <span class="sub2">${on ? '在线' : '离线'} · 在跑 ${(a.tasks || []).length} / ${a.capacity || 0}</span>
        <span class="grow"></span>
        <button class="sm ${a.paused ? 'go' : ''}" data-id="${esc(a.id)}"
          data-act="${a.paused ? 'resume' : 'pause'}">${a.paused ? '恢复接单' : '暂停接单'}</button>
      </div>`;
    }).join('') || '<div class="empty">暂无节点</div>';
    document.querySelectorAll('#dpAgents button').forEach(b => {
      b.onclick = async () => {
        try {
          await call('/admin/agents/' + encodeURIComponent(b.dataset.id) + '/' + b.dataset.act,
                     {method: 'POST'});
          toast(b.dataset.id + (b.dataset.act === 'pause' ? ' 已暂停接单' : ' 已恢复接单'));
          renderDispatch();
        } catch (e) { toast(e.message, true); }
      };
    });
  } catch (e) {
    $('dpBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function setAnDays(d) { AN_DAYS = d; renderAnalytics(); }

async function loadAnalytics() {
  try {
    const d = await call('/admin/analytics?days=' + AN_DAYS);
    $('anHint').textContent = `统计范围：近 ${d.days} 天（北京时间）`;
    const o = d.outcome, c = d.cards;
    const pct = x => (x * 100).toFixed(1) + '%';
    $('anCards').innerHTML = [
      [o.done, '完成任务'], [o.failed, '失败任务'], [o.canceled, '取消任务'],
      [pct(o.success_rate), '服务成功率'],
      [pct(c.usage_rate), '卡密使用率（' + c.used + '/' + c.total + '）'],
    ].map(([n, l]) => `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

    const mx = Math.max(1, ...d.trend.flatMap(t => [t.created, t.done, t.failed]));
    $('anTrend').innerHTML = d.trend.map(t =>
      `<div class="tcol"><div class="tbars" style="height:110px">
         <div class="tbar c" style="height:${Math.round(t.created / mx * 106)}px" title="新增 ${t.created}"></div>
         <div class="tbar d" style="height:${Math.round(t.done / mx * 106)}px" title="完成 ${t.done}"></div>
         <div class="tbar" style="height:${Math.round(t.failed / mx * 106)}px;background:linear-gradient(180deg,#FF5B6E,#a12e3d)" title="失败 ${t.failed}"></div>
       </div><div class="tlab">${t.date}</div></div>`).join('');
    $('anTable').innerHTML = d.trend.slice().reverse().map(t =>
      `<tr><td class="mono">${t.date}</td><td>${t.created}</td>
       <td style="color:var(--ok)">${t.done}</td>
       <td style="color:${t.failed ? 'var(--err)' : 'inherit'}">${t.failed}</td></tr>`).join('');
  } catch (e) {
    $('anCards').innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(e.message)}</div>`;
  }
}

      <div class="ptitle">新建任务<span class="r"><span class="badge">管理员操作 · admin_manual</span></span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px">
        <div><label>学习通账号</label><input id="f_user" placeholder="手机号"></div>
        <div><label>密码</label><input id="f_pwd" type="password"></div>
        <div><label>课程名称</label><input id="f_name" placeholder="照抄课表上的完整课程名"></div>
        <div><label>授课老师 / 备注</label><input id="f_note" placeholder="选填"></div>
      </div>
      <div class="ops" style="margin-top:18px">
        <button id="btnCreate" class="primary">提交补单</button>
      </div>
      <div class="note">补单不填卡密时系统自动生成一张并记账；创建来源记录为管理员补单，全程写入事件日志。</div>
    </div>`;
  $('btnCreate').onclick = async () => {
    const u = $('f_user').value.trim(), p = $('f_pwd').value;
    const n = $('f_name').value.trim(), note = $('f_note').value.trim();
    if (!u || !p || !n) { toast('账号、密码、课程名都要填', true); return; }
    $('btnCreate').disabled = true;
    try {
      await call('/admin/task', {
        method: 'POST',
        body: JSON.stringify({username: u, password: p, course_name: n, note: note})
      });
      toast('补单已创建');
      $('f_user').value = $('f_pwd').value = $('f_name').value = $('f_note').value = '';
      location.hash = '#/tasks';
    } catch (e) { toast(e.message, true); }
    $('btnCreate').disabled = false;
  };
}

/* ---------- 启动 ---------- */
(async () => {
  try {
    await call('/admin/stats');
    $('loginBox').classList.add('hidden');
    $('app').classList.remove('hidden');
    refreshChip();
    route();
  } catch (e) { showLogin(); }
})();
</script>
</html>
